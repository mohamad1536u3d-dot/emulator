name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Build APK
        run: |
          chmod +x tools/build_box64_android.sh || true
          echo "Building emulator package..."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: GameEmulator-APK
          path: ./*.apk
