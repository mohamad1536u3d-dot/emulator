name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.5.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.5.1-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --editor --quit
          godot --headless --path . --export-debug "Android" build/WindowsGameEmulator-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WindowsGameEmulator-debug
          path: build/WindowsGameEmulator-debug.apk
